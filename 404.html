<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Сторінку не знайдено — SiteBoosty</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#efede6">
<meta name="color-scheme" content="light">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- Absolute paths: GitHub Pages serves this file for any missing URL, at any depth. -->
<style>
@font-face{font-family:Onest;font-weight:100 900;font-display:swap;src:url(/fonts/onest-cyrillic.woff2) format('woff2');unicode-range:U+0400-045F,U+0490-0491,U+2116}
@font-face{font-family:Onest;font-weight:100 900;font-display:swap;src:url(/fonts/onest-latin.woff2) format('woff2');unicode-range:U+0020-007E,U+00A0,U+00A9,U+00AB,U+00B0,U+00B7,U+00BB,U+00D7,U+2010-2027,U+2030-203A,U+20AC,U+2122,U+2212}
@font-face{font-family:Plex;font-weight:500;font-display:swap;src:url(/fonts/plexmono-cyrillic.woff2) format('woff2');unicode-range:U+0400-045F,U+0490-0491,U+2116}
@font-face{font-family:Plex;font-weight:500;font-display:swap;src:url(/fonts/plexmono-latin.woff2) format('woff2');unicode-range:U+0020-007E,U+00A0,U+00A9,U+00AB,U+00B0,U+00B7,U+00BB,U+00D7,U+2010-2027,U+2030-203A,U+20AC,U+2122,U+2212}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;flex-direction:column;background:#efede6;color:#121212;font:400 17px/1.5 Onest,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:Plex,Onest,ui-monospace,Menlo,monospace;font-weight:500}
header{border-bottom:1.5px solid #121212;padding:0 clamp(16px,4vw,48px);height:60px;display:flex;align-items:center}
.logo{display:flex;align-items:center;gap:10px;font-size:17px;text-decoration:none;color:inherit;letter-spacing:-.02em}
.sq{display:inline-block;width:.62em;height:.62em;background:#ffd23f;outline:1.5px solid #121212}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 16px}
.ticket{position:relative;width:100%;max-width:460px;background:#fbfaf6;padding:28px 24px 26px;box-shadow:0 1px 0 #cbc8bd,0 18px 40px -22px rgba(0,0,0,.35)}
.ticket:before{content:"";position:absolute;left:0;right:0;top:-7px;height:8px;background:radial-gradient(circle at 6px 0,transparent 5px,#fbfaf6 5.5px) 0 0/12px 8px repeat-x}
.head{display:flex;justify-content:space-between;gap:12px;font-size:13px;letter-spacing:.08em;border-bottom:1.5px dashed #121212;padding-bottom:12px}
.head span:last-child{color:#58574f}
.code{font-size:88px;line-height:1;letter-spacing:-.06em;margin:26px 0 6px}
h1{font-size:30px;line-height:1.05;letter-spacing:-.035em;font-weight:800}
p{color:#58574f;margin:12px 0 26px;font-size:16px}
.row{display:flex;flex-wrap:wrap;gap:12px}
a.btn{display:inline-flex;align-items:center;justify-content:center;padding:15px 22px;border-radius:3px;font-weight:600;font-size:16px;text-decoration:none;color:#121212;box-shadow:inset 0 0 0 1.5px #121212}
a.btn.main{background:#121212;color:#fff;box-shadow:none}
.stamp{position:absolute;right:22px;top:70px;border:2.5px solid #c03028;color:#c03028;font-size:12px;line-height:1.15;letter-spacing:.08em;text-align:center;padding:7px 9px;transform:rotate(-9deg);border-radius:4px;opacity:.88}
@media(max-width:420px){a.btn{flex:1 1 100%}}
</style>
</head>
<body>
<header><a class="logo mono" href="/"><i class="sq"></i>siteboosty</a></header>
<main>
  <div class="ticket">
    <div class="head mono"><span>ЗАЯВКА</span><span>siteboosty.com</span></div>
    <div class="stamp mono">НЕ<br>ЗНАЙДЕНО</div>
    <div class="code mono">404</div>
    <h1>Такої сторінки немає</h1>
    <p>Можливо, посилання застаріло або в адресі помилка. Поверніться на головну або напишіть у Telegram.</p>
    <div class="row">
      <a class="btn main" href="/">На головну</a>
      <a class="btn" href="https://t.me/webdev342" target="_blank" rel="noopener">Написати в Telegram</a>
    </div>
  </div>
</main>
</body>
</html>
